[project]
name = "ai-rnd-foundation"
version = "0.2.0"
description = "FastapiAdmin-based, specification-first AI software factory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128.2,<1", "uvicorn>=0.48,<1", "sqlalchemy>=2.0.50,<2.1",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.12.5,<3", "pydantic-settings>=2.6.1,<3",
  "httpx==0.28.1", "jinja2==3.1.6", "alembic>=1.18.4,<2",
  "langgraph>=1.0,<2", "temporalio>=1.12,<2", "diagrams>=0.24,<1",
  "mcp>=1.10,<2", "pyyaml>=6,<7", "cryptography>=45,<47", "litellm>=1.80,<2"
]
[project.optional-dependencies]
cube = ["e2b-code-interpreter>=2.4.1,<3"]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["factory"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
