name: Foundation contracts
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: disposable-contract-only
          POSTGRES_DB: contract
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U contract -d contract"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FACTORY_TEST_POSTGRES_URL: postgresql+psycopg://contract:disposable-contract-only@127.0.0.1:55433/contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv sync --extra dev
      - run: uv run pytest --junitxml=reports/junit-ci.xml
      - name: Record exact source under test (tracked files only, no credentials)
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-commit.txt
          git archive --format=tar --output=reports/source-under-test.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: reports/
          retention-days: 7

  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the real FastapiAdmin frontend stage
        run: docker build --target frontend -t ai-rnd-frontend-smoke .
      - name: Extract built frontend
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create ai-rnd-frontend-smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/web/dist" ./frontend-dist
          docker rm "$cid" >/dev/null
          trap - EXIT
      - name: Verify root-path-aware asset URLs
        run: python3 scripts/verify_frontend_dist.py frontend-dist /api/v1/web/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/rnd-browser" --no-save playwright@1.58.2
          "$RUNNER_TEMP/rnd-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render actual workbench components inside an embedded shell
        run: |
          docker run -d --name rnd-browser -p 127.0.0.1:4173:4173 -v "$PWD/tests/ui:/checks:ro" ai-rnd-frontend-smoke node /checks/serve.cjs
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          NODE_PATH="$RUNNER_TEMP/rnd-browser/node_modules" node tests/ui/browser.cjs
      - name: Browser harness diagnostics
        if: failure()
        run: docker logs rnd-browser || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-layout-reports
          path: ui-reports/
          retention-days: 7

  # External-service E2E requires administrator-provided endpoints and credentials.

  core-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable credentials
        run: python3 scripts/init_env.py
      - name: Build actual host and its frontend dependency cache
        run: |
          docker build --target frontend -t ai-rnd-frontend-smoke .
          docker build -t ai-rnd-foundation:0.1.0 .
          docker build -f Dockerfile.acceptance -t ai-rnd-acceptance:ci .
      - name: Prove existing-volume PostgreSQL password recovery
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yaml -f compose.ci.yaml)
          "${compose[@]}" up -d --wait --wait-timeout 120 postgres
          # Simulate a database volume initialized by an older .env.
          "${compose[@]}" exec -T -u postgres postgres \
            psql -U factory -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE factory WITH PASSWORD 'ci-stale-volume-password';" >/dev/null
          "${compose[@]}" run --rm postgres-auth-sync
          password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env | head -n 1)"
          test -n "$password"
          "${compose[@]}" exec -T -e PGPASSWORD="$password" postgres \
            psql -h 127.0.0.1 -U factory -d factory -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null
      - name: Start isolated PostgreSQL, Redis and Temporal worker
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d redis worker
      - name: Exercise clarification, approval, delivery and genuine product authentication
        run: timeout 900 docker compose -f compose.yaml -f compose.ci.yaml run --use-aliases --rm acceptance
      - name: Validate generated C4 DSL with the actual Structurizr parser
        shell: bash
        run: |
          set -euo pipefail
          dsl="$(sudo find data/runs -path '*/analysis/architecture/workspace.dsl' -print -quit)"
          test -n "$dsl"
          # Stage only the generated DSL, not credentials or the private run tree.
          dir="$(mktemp -d "$RUNNER_TEMP/rnd-c4.XXXXXX")"
          trap 'rm -rf "$dir"' EXIT
          sudo install -m 0644 "$dsl" "$dir/workspace.dsl"
          sudo chown "$(id -u):$(id -g)" "$dir/workspace.dsl"
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=1g --pids-limit=256 --tmpfs /tmp:rw,nosuid,size=128m --mount "type=bind,source=$dir,target=/usr/local/structurizr,readonly" --entrypoint java structurizr/structurizr:2026.06.28-noble -jar /usr/local/structurizr.war validate -w /usr/local/structurizr/workspace.dsl
          echo '{"structurizr_parser":"passed","source":"generated_analysis"}' | sudo tee data/ci-reports/structurizr.json >/dev/null
      - name: Build distributable Coder and Cube verifier images
        run: |
          docker builder prune -af
          docker build -t ai-rnd-coder:0.2.0 integrations/coder
          docker run --rm --network none --entrypoint sh ai-rnd-coder:0.2.0 -c 'test "$(id -u)" != 0 && python3 --version && uv --version && node --version && pnpm --version'
          docker build -f integrations/cube/Dockerfile.fullstack -t ai-rnd-cube-verifier:ci .
          docker run --rm --entrypoint /opt/rnd-runtime/.venv/bin/python ai-rnd-cube-verifier:ci -c 'import sqlalchemy,redis,fastapi;from pathlib import Path;assert Path("/opt/rnd-verifier/full_stack.py").is_file()'
      - name: Run offline product acceptance inside the actual Cube image
        run: bash scripts/verify_cube_image.sh
      - name: Verify optional tool consoles can start without model credentials
        run: |
          docker builder prune -af
          python3 scripts/setup_toolchain.py
          docker compose -f compose.yaml -f compose.tools.yaml --profile ai --profile tools up -d litellm coder
          python3 scripts/check_tool_consoles.py --workspace-network ai-rnd_default
      - name: Collect worker diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail=180 postgres postgres-auth-sync migrate worker
      - name: Export only acceptance reports from the private data directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core-stack-reports
          if sudo test -d data/ci-reports; then
            sudo cp -R data/ci-reports/. core-stack-reports/
            sudo chown -R "$(id -u):$(id -g)" core-stack-reports
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-stack-acceptance
          path: core-stack-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-console-readiness
          path: tool-console-reports/
          retention-days: 7
      - name: Remove this job's disposable stack
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml -f compose.tools.yaml --profile ai --profile tools down --volumes --remove-orphans

  coder-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validate template schema without provisioning or credentials
        working-directory: integrations/coder
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coder-template-lock
          include-hidden-files: true
          path: integrations/coder/.terraform.lock.hcl
          retention-days: 7

  c4-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Parse generator output, Unicode and hostile-label cases
        run: uv run python -m scripts.verify_c4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-parser-contract
          path: c4-reports/
          retention-days: 7
