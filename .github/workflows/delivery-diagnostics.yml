name: Delivery build diagnostics
on:
  push:
    branches: [fix/workbench-integration-readiness]
    paths: [.github/workflows/delivery-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  previous-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed image build from this repository only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 34405899587 --repo Live-yan/ai-rnd-foundation --job 102649062635 --log > "$RUNNER_TEMP/previous-job.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'previous-job.log').read_text().splitlines()
          # Step names may be UNKNOWN STEP in gh fallback logs. These UTC bounds
          # are from the actual Actions job step metadata, not a guessed tail.
          selected = []
          for line in lines:
              stamp = re.search(r'2026-09-09T\d\d:\d\d:\d\d', line)
              if stamp and '2026-09-09T21:22:44' <= stamp[0] < '2026-09-09T21:23:21':
                  selected.append(line)
          assert selected, 'Image-build time range missing from job log'
          text = '\n'.join(selected[-100:]) + '\n'
          out = Path('build-diagnostics')
          out.mkdir()
          (out / 'image-build-tail.txt').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: failed-image-build-diagnostics
          path: build-diagnostics/
          retention-days: 7
